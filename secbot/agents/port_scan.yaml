name: port_scan
display_name: 端口与服务扫描
description: |
  Enumerate open ports and identify running services / banners on target
  hosts. Input: a list of hosts (IPs / hostnames). Skip this agent when
  the targets already carry explicit ports (e.g. a URL like
  http://host:port/... or an IP:port pair) — the host and service port
  are already known; re-scanning them wastes time.

system_prompt_file: ./prompts/port_scan.md

scoped_skills:
  - qscan-port-scan

max_iterations: 10
emit_plan_steps: true

legacy_input_schema:
  type: object
  required: [targets]
  properties:
    targets:
      type: array
      items: {type: string}
      minItems: 1
      description: List of IPs / hostnames to scan
    ports:
      type: string
      description: Optional port spec, e.g. "1-1024" or "top-1000"
    rate:
      type: string
      enum: [slow, normal, fast]
      default: normal

output_schema:
  type: object
  required: [services]
  properties:
    services:
      type: array
      items:
        type: object
        required: [host, port, protocol]
        properties:
          host:     {type: string}
          port:     {type: integer}
          protocol: {type: string, enum: [tcp, udp]}
          service:  {type: string}
          version:  {type: string}
