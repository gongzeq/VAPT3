name: asset_discovery
display_name: 资产探测
description: |
  Discover live hosts, services and basic asset inventory under a target
  CIDR / IP / domain. Also exposes read/write helpers for the local CMDB
  so the orchestrator can record newly discovered assets and query
  historical scans.

  Applicable when the target is a CIDR range, subnet, or ambiguous scope
  that requires host enumeration. When a single IP or URL is already
  clearly specified, skip this agent and proceed to the next appropriate
  one (e.g. port_scan or crawl_web).

system_prompt_file: ./prompts/asset_discovery.md

scoped_skills:
  - qscan-host-discovery
  - fscan-asset-discovery
  - httpx-probe

max_iterations: 10
emit_plan_steps: true

legacy_input_schema:
  type: object
  required: [target]
  properties:
    target:
      type: string
      description: CIDR / IP / domain
    label:
      type: string
      description: Optional human label written into CMDB

output_schema:
  type: object
  required: [assets]
  properties:
    assets:
      type: array
      items:
        type: object
        required: [target, kind]
        properties:
          target: {type: string}
          kind:   {type: string, enum: [cidr, ip, domain]}
          label:  {type: string}
